<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="180" fill="url(#accent)" opacity="0.05"/>
  <!-- Globe abstraction -->
  <g transform="translate(600,260)" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.2">
    <circle cx="0" cy="0" r="60"/>
    <ellipse cx="0" cy="0" rx="60" ry="25"/>
    <ellipse cx="0" cy="0" rx="25" ry="60"/>
    <line x1="-60" y1="-15" x2="60" y2="-15"/>
    <line x1="-60" y1="15" x2="60" y2="15"/>
  </g>
  <!-- Search/magnifying glass -->
  <g transform="translate(0,0)" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.12">
    <circle cx="450" cy="250" r="25"/>
    <line x1="468" y1="268" x2="485" y2="285"/>
  </g>
  <!-- Target icons -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.1">
    <circle cx="750" cy="220" r="20"/>
    <circle cx="750" cy="220" r="12"/>
    <circle cx="750" cy="220" r="4"/>
    <circle cx="350" cy="380" r="16"/>
    <circle cx="350" cy="380" r="9"/>
    <circle cx="350" cy="380" r="3"/>
    <circle cx="850" cy="380" r="14"/>
    <circle cx="850" cy="380" r="8"/>
    <circle cx="850" cy="380" r="2"/>
  </g>
  <!-- Dots -->
  <g fill="#3b82f6" opacity="0.08">
    <circle cx="150" cy="150" r="2"/>
    <circle cx="300" cy="120" r="2"/>
    <circle cx="500" cy="140" r="2"/>
    <circle cx="700" cy="120" r="2"/>
    <circle cx="900" cy="150" r="2"/>
    <circle cx="1050" cy="130" r="2"/>
    <circle cx="200" cy="500" r="2"/>
    <circle cx="400" cy="520" r="2"/>
    <circle cx="600" cy="510" r="2"/>
    <circle cx="800" cy="520" r="2"/>
    <circle cx="1000" cy="500" r="2"/>
  </g>
  <text x="600" y="490" text-anchor="middle" fill="#f5f5f5" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">SEO, Geo &amp; AEO Content Optimization</text>
  <text x="600" y="520" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,-apple-system,sans-serif" font-size="15">Modern strategies for search and answer engines</text>
</svg>
