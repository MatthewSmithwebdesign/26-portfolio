<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="400" cy="315" r="140" fill="#3b82f6" opacity="0.06"/>
  <circle cx="800" cy="315" r="140" fill="#22c55e" opacity="0.06"/>
  <!-- Code brackets -->
  <g transform="translate(600,260)" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.2">
    <path d="M-80,-40 L-120,0 L-80,40"/>
    <path d="M80,-40 L120,0 L80,40"/>
  </g>
  <!-- Arrow between -->
  <g fill="none" stroke="#f5f5f5" stroke-width="2" opacity="0.08">
    <path d="M-20,0 L20,0"/>
    <polygon points="15,-6 25,0 15,6" fill="#f5f5f5" opacity="0.08"/>
  </g>
  <!-- Django icon abstraction -->
  <g transform="translate(430,260)" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.15">
    <ellipse cx="0" cy="0" rx="30" ry="20"/>
    <line x1="-30" y1="0" x2="-30" y2="30"/>
    <line x1="30" y1="0" x2="30" y2="30"/>
  </g>
  <!-- Next.js icon abstraction -->
  <g transform="translate(770,260)" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.15">
    <rect x="-25" y="-25" width="50" height="50" rx="8"/>
  </g>
  <!-- Code lines -->
  <g fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.06">
    <rect x="120" y="380" width="160" height="16" rx="3"/>
    <rect x="120" y="408" width="120" height="16" rx="3"/>
    <rect x="120" y="436" width="180" height="16" rx="3"/>
    <rect x="120" y="464" width="100" height="16" rx="3"/>
    <rect x="920" y="380" width="160" height="16" rx="3"/>
    <rect x="920" y="408" width="120" height="16" rx="3"/>
    <rect x="920" y="436" width="180" height="16" rx="3"/>
    <rect x="920" y="464" width="100" height="16" rx="3"/>
  </g>
  <text x="600" y="490" text-anchor="middle" fill="#f5f5f5" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Django Dev Tries Next.js</text>
  <text x="600" y="520" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,-apple-system,sans-serif" font-size="15">Lessons learned from transitioning frameworks</text>
</svg>
