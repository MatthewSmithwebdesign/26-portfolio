<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="200" fill="url(#glow)" opacity="0.6"/>
  <circle cx="200" cy="315" r="180" fill="url(#accent)" opacity="0.08"/>
  <circle cx="1000" cy="200" r="140" fill="#8b5cf6" opacity="0.06"/>
  <circle cx="600" cy="500" r="100" fill="#3b82f6" opacity="0.05"/>
  <!-- Circuit lines -->
  <g stroke="#3b82f6" stroke-width="1.5" opacity="0.15" fill="none">
    <path d="M100 315 L200 315 L250 250 L350 250"/>
    <path d="M850 400 L950 400 L1000 350 L1100 350"/>
    <path d="M300 450 L350 450 L400 380 L500 380"/>
    <path d="M700 180 L750 180 L800 120 L900 120"/>
  </g>
  <!-- Nodes -->
  <g fill="#3b82f6" opacity="0.25">
