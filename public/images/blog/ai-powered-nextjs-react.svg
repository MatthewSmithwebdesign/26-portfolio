    <circle cx="350" cy="250" r="3"/>
    <circle cx="950" cy="400" r="4"/>
    <circle cx="400" cy="380" r="3"/>
    <circle cx="750" cy="180" r="3"/>
  </g>
  <!-- AI brain icon -->
  <g transform="translate(600,260)" fill="none" stroke="url(#accent)" stroke-width="2.5">
    <path d="M-40,0 C-40,-30 -20,-50 0,-50 C20,-50 40,-30 40,0 C40,20 30,35 20,40 L15,60 L-15,60 L-20,40 C-30,35 -40,20 -40,0Z" opacity="0.3"/>
    <path d="M-25,0 C-25,-18 -12,-30 0,-30 C12,-30 25,-18 25,0 C25,12 18,22 10,25 L8,35 L-8,35 L-10,25 C-18,22 -25,12 -25,0Z" opacity="0.5"/>
  </g>
  <!-- Dots grid -->
  <g fill="#3b82f6" opacity="0.08">
    <circle cx="100" cy="100" r="2"/>
    <circle cx="200" cy="80" r="2"/>
    <circle cx="350" cy="120" r="2"/>
    <circle cx="500" cy="90" r="2"/>
    <circle cx="650" cy="110" r="2"/>
    <circle cx="800" cy="80" r="2"/>
    <circle cx="950" cy="120" r="2"/>
    <circle cx="1100" cy="100" r="2"/>
    <circle cx="150" cy="550" r="2"/>
    <circle cx="350" cy="570" r="2"/>
    <circle cx="550" cy="540" r="2"/>
    <circle cx="750" cy="560" r="2"/>
    <circle cx="950" cy="540" r="2"/>
    <circle cx="1050" cy="570" r="2"/>
