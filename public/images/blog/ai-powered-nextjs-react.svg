  <!-- Title -->
  <text x="600" y="480" text-anchor="middle" fill="#f5f5f5" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">AI-Powered Next.js &amp; React</text>
  <text x="600" y="510" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,-apple-system,sans-serif" font-size="15">Building intelligent features with LLMs and modern frameworks</text>
