<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d9bf0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="200" fill="#1d9bf0" opacity="0.04"/>
  <!-- Network nodes -->
  <g fill="#3b82f6" opacity="0.12">
    <circle cx="600" cy="240" r="20"/>
    <circle cx="400" cy="320" r="14"/>
    <circle cx="800" cy="320" r="14"/>
    <circle cx="300" cy="400" r="10"/>
    <circle cx="500" cy="420" r="10"/>
    <circle cx="700" cy="420" r="10"/>
    <circle cx="900" cy="400" r="10"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#3b82f6" stroke-width="1.5" opacity="0.08" fill="none">
    <line x1="600" y1="240" x2="400" y2="320"/>
    <line x1="600" y1="240" x2="800" y2="320"/>
    <line x1="400" y1="320" x2="300" y2="400"/>
    <line x1="400" y1="320" x2="500" y2="420"/>
    <line x1="800" y1="320" x2="700" y2="420"/>
    <line x1="800" y1="320" x2="900" y2="400"/>
    <line x1="600" y1="240" x2="500" y2="420"/>
    <line x1="600" y1="240" x2="700" y2="420"/>
  </g>
  <!-- Speaker icon -->
  <g transform="translate(600,240)" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4">
    <rect x="-8" y="-15" width="16" height="30" rx="2"/>
    <path d="M8,-10 L20,-20 L20,20 L8,10"/>
  </g>
  <!-- Sound waves -->
  <g fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.08">
    <path d="M60 280 Q80 270 100 280"/>
    <path d="M40 300 Q70 280 100 300"/>
    <path d="M1100 280 Q1120 270 1140 280"/>
    <path d="M1100 300 Q1130 280 1160 300"/>
    <path d="M80 440 Q100 430 120 440"/>
    <path d="M1080 440 Q1100 430 1120 440"/>
  </g>
  <text x="600" y="490" text-anchor="middle" fill="#f5f5f5" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">Growing Your Network with Twitter Spaces</text>
  <text x="600" y="520" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,-apple-system,sans-serif" font-size="15">Building meaningful connections through audio conversations</text>
</svg>
