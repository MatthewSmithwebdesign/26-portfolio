<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="250" cy="315" r="160" fill="url(#accent)" opacity="0.05"/>
  <circle cx="950" cy="315" r="130" fill="#06b6d4" opacity="0.04"/>
  <!-- Butterfly/wings icon (Wagtail's mascot) -->
  <g transform="translate(600,260)" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.2">
    <path d="M0,0 C-20,-40 -70,-50 -60,-20 C-50,10 -10,10 0,0Z"/>
    <path d="M0,0 C20,-40 70,-50 60,-20 C50,10 10,10 0,0Z"/>
    <path d="M0,0 C-15,25 -50,40 -45,20 C-40,5 -10,5 0,0Z"/>
    <path d="M0,0 C15,25 50,40 45,20 C40,5 10,5 0,0Z"/>
    <line x1="0" y1="-5" x2="0" y2="15" stroke-width="2"/>
  </g>
  <!-- Content blocks -->
  <g fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.08">
    <rect x="120" y="400" width="80" height="50" rx="6"/>
    <rect x="210" y="400" width="80" height="50" rx="6"/>
    <rect x="300" y="400" width="80" height="50" rx="6"/>
    <rect x="120" y="460" width="80" height="30" rx="6"/>
    <rect x="210" y="460" width="80" height="30" rx="6"/>
    <rect x="300" y="460" width="80" height="30" rx="6"/>
    <rect x="820" y="400" width="80" height="50" rx="6"/>
    <rect x="910" y="400" width="80" height="50" rx="6"/>
    <rect x="1000" y="400" width="80" height="50" rx="6"/>
    <rect x="820" y="460" width="80" height="30" rx="6"/>
    <rect x="910" y="460" width="80" height="30" rx="6"/>
    <rect x="1000" y="460" width="80" height="30" rx="6"/>
  </g>
  <g fill="#06b6d4" opacity="0.06">
    <circle cx="200" cy="150" r="4"/>
    <circle cx="400" cy="120" r="3"/>
    <circle cx="600" cy="100" r="4"/>
    <circle cx="800" cy="130" r="3"/>
    <circle cx="1000" cy="110" r="4"/>
    <circle cx="300" cy="560" r="3"/>
    <circle cx="500" cy="570" r="4"/>
    <circle cx="700" cy="560" r="3"/>
    <circle cx="900" cy="570" r="4"/>
  </g>
  <text x="600" y="490" text-anchor="middle" fill="#f5f5f5" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Why Not Try Wagtail CMS?</text>
  <text x="600" y="520" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,-apple-system,sans-serif" font-size="15">A fresh look at the Django-based CMS alternative</text>
</svg>
